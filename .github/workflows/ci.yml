name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: php-commerce

      # composer.json declares a `path` repository at ../php so that
      # developers can iterate against a sibling dappcore/php checkout
      # without pushing/tagging. Checking dAppCore/php out as a true
      # sibling directory here (both under $GITHUB_WORKSPACE) satisfies
      # that same relative path on the runner, with no change to
      # composer.json or the local dev workflow.
      - name: Checkout dappcore/php (sibling for path repository)
        uses: actions/checkout@v6
        with:
          repository: dAppCore/php
          path: php

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: pcov

      - name: Install dependencies
        working-directory: php-commerce
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        working-directory: php-commerce
        run: vendor/bin/pint --test

      - name: Run tests
        working-directory: php-commerce
        run: vendor/bin/pest --ci --coverage --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.php == '8.3'
        uses: codecov/codecov-action@v5
        with:
          files: php-commerce/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
